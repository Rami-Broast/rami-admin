<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Rami Broast Admin</title>
    <style>
      /* Self-contained: this page is shown precisely when nothing else can be
         fetched, so it cannot depend on the app's stylesheet or its fonts. */
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #fbf6f1;
        color: #1e1a1c;
        font: 16px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      }
      .card {
        max-width: 460px;
        background: #fff;
        border: 1px solid #ebdce5;
        border-radius: 12px;
        padding: 28px;
        text-align: center;
      }
      img { width: 64px; height: 64px; border-radius: 12px; }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      p { color: #6e6167; margin: 0 0 8px; }
      .note { font-size: 14px; margin-top: 16px; }
      button {
        margin-top: 20px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        border: 0;
        border-radius: 10px;
        padding: 11px 22px;
        background: #752E2A;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icon-192.png" alt="" />
      <h1>No connection</h1>
      <p>The admin panel needs the network — it shows live orders, and nothing here is stored on this computer.</p>
      <p class="note">
        Nothing has been lost. Orders keep arriving on the server, and the panel
        will show them as soon as it can reach it again.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
